services:
  nase-web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NASE_WEB_HOST: 0.0.0.0
      NASE_WEB_PORT: 8787
    ports:
      - "${NASE_WEB_PORT_PUBLISHED:-8787}:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/snapshot', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  space-agent:
    build:
      context: .
      dockerfile: docker/space-agent.Dockerfile
      args:
        SPACE_AGENT_REF: "${SPACE_AGENT_REF:-main}"
    depends_on:
      nase-web:
        condition: service_healthy
    environment:
      CUSTOMWARE_PATH: /workspace/nase/integrations/space-agent/customware
      SINGLE_USER_APP: "true"
      LOGIN_ALLOWED: "false"
      HOST: 0.0.0.0
      PORT: 8788
    ports:
      - "${SPACE_AGENT_PORT_PUBLISHED:-8788}:8788"
    volumes:
      - .:/workspace/nase:ro
      - ./docker/space-agent-nase-config.js:/workspace/nase/integrations/space-agent/customware/L1/_all/mod/nase/arbitrage/config.js:ro

  nase-executor:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      nase-web:
        condition: service_healthy
    environment:
      NASE_EXECUTOR_HOST: 0.0.0.0
      NASE_EXECUTOR_PORT: 8790
      NASE_API_BASE: http://nase-web:8787
      NASE_EXECUTOR_LEDGER_PATH: /data/ledger.jsonl
      NASE_EXECUTOR_LIVE_TRADING_ENABLED: "false"
      NASE_EXECUTOR_MAX_TRADE_USD: "${NASE_EXECUTOR_MAX_TRADE_USD:-250}"
      NASE_EXECUTOR_MAX_DAILY_USD: "${NASE_EXECUTOR_MAX_DAILY_USD:-1000}"
    command: ["nase-executor"]
    ports:
      - "${NASE_EXECUTOR_PORT_PUBLISHED:-8790}:8790"
    volumes:
      - nase-executor-data:/data

volumes:
  nase-executor-data:
